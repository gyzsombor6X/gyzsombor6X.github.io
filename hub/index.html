<script>
    napok=new Array("vasárnap","hétfő","kedd","szerda","csütörtök","péntek","szombat");
    function frissit(){
        most=new Date();
        ev=most.getYear();
        ho=most.getMonth()+1;
        nap=most.getDate();
        sorszam=most.getDay();
        ora=most.getHours();
        perc=most.getMinutes();
        sec=most.getSeconds();
        if(ev<1900) ev=ev+1900;
        if(ho<10) ho="0"+ho;
        if(nap<10) nap="0"+nap;
        if(ora<10) ora="0"+ora;
        if(perc<10) perc="0"+perc;
        if(sec<10) sec="0"+sec;
        kijelzo1.innerHTML=ora+":"+perc+":"+sec;
        kijelzo2.innerHTML=ev+"."+ho+"."+nap+" "+napok[sorszam];
    }
    setInterval("frissit()",1000);
    frissit();
    </script>
